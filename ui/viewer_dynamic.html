<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remember Twelve - Dynamic Gallery</title>

    <!-- Typography - Inter (clean sans-serif) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Optional serif for warmth in headlines -->
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        /* ============================================
           MARU COFFEE AESTHETIC VARIABLES
           ============================================ */
        :root {
            /* Colors - Warm Neutrals */
            --surface-primary: #FAFAF8;
            --surface-secondary: #F3F3F3;
            --surface-tertiary: #EEEDE9;
            --surface-elevated: #FFFFFF;

            /* Accents - Muted Natural Tones */
            --accent-sage: #7396A2;
            --accent-sage-deep: #5487A0;

            /* Text - Warm Charcoal */
            --text-primary: #2A2825;
            --text-secondary: #5A5551;
            --text-tertiary: #8A857F;
            --text-muted: #6B6864;

            /* Shadows - 4-Layer System */
            --shadow-soft:
                0 0 0 1px rgba(42, 40, 37, 0.04),
                0 1px 2px rgba(42, 40, 37, 0.06),
                0 4px 8px rgba(42, 40, 37, 0.04);

            --shadow-medium:
                0 0 0 1px rgba(42, 40, 37, 0.04),
                0 2px 4px rgba(42, 40, 37, 0.08),
                0 8px 16px rgba(42, 40, 37, 0.08);

            /* Corner Radius */
            --radius-small: 6px;
            --radius-medium: 8px;
            --radius-large: 12px;
            --radius-pill: 20px;

            /* Spacing */
            --space-small: 8px;
            --space-medium: 16px;
            --space-large: 24px;
            --space-xlarge: 40px;

            /* Motion */
            --transition-standard: 350ms cubic-bezier(0.4, 0.0, 0.2, 1);

            /* Typography */
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Merriweather', Georgia, serif;
        }

        body {
            font-family: var(--font-sans);
            background: var(--surface-primary);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        .header {
            background: var(--surface-elevated);
            box-shadow: var(--shadow-soft);
            padding: var(--space-large) 0;
            margin-bottom: var(--space-xlarge);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-large);
        }

        .year-title {
            font-family: var(--font-serif);
            font-size: 48px;
            font-weight: 300;
            margin: 0;
            color: var(--accent-sage);
            line-height: 1.1;
        }

        .subtitle {
            font-size: 18px;
            color: var(--text-secondary);
            margin: 8px 0 0 0;
            line-height: 1.5;
        }

        .stats-row {
            margin-top: var(--space-medium);
            display: flex;
            gap: var(--space-large);
            flex-wrap: wrap;
        }

        .stat-chip {
            background: var(--surface-secondary);
            padding: 8px var(--space-medium);
            border-radius: var(--radius-medium);
            font-size: 14px;
            color: var(--text-primary);
        }

        .stat-chip .material-icons {
            font-size: 16px;
            vertical-align: middle;
            margin-right: 4px;
        }

        .container-custom {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 var(--space-large) 48px var(--space-large);
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--space-large);
            margin-top: 32px;
        }

        .photo-card {
            background: var(--surface-elevated);
            border-radius: var(--radius-medium);
            overflow: hidden;
            box-shadow: var(--shadow-soft);
            transition: all var(--transition-standard);
            cursor: pointer;
            position: relative;
        }

        .photo-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-medium);
        }

        .photo-card:hover .swap-overlay {
            opacity: 1;
        }

        /* Swap button overlay */
        .swap-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(42, 40, 37, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity var(--transition-standard);
            z-index: 10;
        }

        .swap-btn {
            background: var(--surface-elevated);
            color: var(--accent-sage-deep);
            border: 2px solid var(--accent-sage);
            padding: 12px 24px;
            border-radius: var(--radius-small);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .swap-btn:hover {
            background: var(--accent-sage);
            color: var(--surface-elevated);
            transform: scale(1.05);
        }

        .photo-img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            background: linear-gradient(135deg, var(--surface-secondary) 0%, var(--surface-tertiary) 100%);
        }

        .card-content {
            padding: var(--space-large);
        }

        .card-month {
            font-size: 16px;
            text-transform: uppercase;
            color: var(--accent-sage-deep);
            font-weight: 600;
            letter-spacing: 1.5px;
        }

        .card-date {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
            line-height: 1.5;
        }

        .card-filename {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 8px;
            font-family: 'SF Mono', 'Consolas', monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .score-row {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .score-badge {
            flex: 1;
            padding: 8px;
            border-radius: var(--radius-medium);
            text-align: center;
            font-size: 12px;
        }

        .score-badge.high {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .score-badge.medium {
            background: #fff3e0;
            color: #e65100;
        }

        .score-badge.low {
            background: #ffebee;
            color: #c62828;
        }

        .score-label {
            font-size: 10px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .score-value {
            font-size: 18px;
            font-weight: 500;
        }

        .rank-badge {
            position: absolute;
            top: var(--space-medium);
            left: var(--space-medium);
            background: rgba(255, 255, 255, 0.95);
            color: var(--accent-sage);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            box-shadow: var(--shadow-soft);
        }

        .photo-wrapper {
            position: relative;
        }

        .timeline {
            background: var(--surface-elevated);
            border-radius: var(--radius-medium);
            padding: var(--space-large);
            margin-bottom: 32px;
            box-shadow: var(--shadow-soft);
        }

        .timeline-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: var(--space-medium);
            color: var(--text-primary);
        }

        .months-row {
            display: flex;
            gap: 8px;
            overflow-x: auto;
        }

        .month-pill {
            padding: 8px var(--space-medium);
            border-radius: var(--radius-pill);
            background: var(--surface-secondary);
            color: var(--text-tertiary);
            font-size: 13px;
            white-space: nowrap;
            transition: all var(--transition-standard);
        }

        .month-pill.active {
            background: var(--accent-sage);
            color: var(--surface-elevated);
            font-weight: 500;
        }

        .empty-month {
            background: #F3F3F3;
            border: 1px solid #E5E5E5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            min-height: 400px;
            transition: var(--transition-standard);
        }

        .empty-month:hover {
            opacity: 0.8;
            border-color: #D0D0D0;
        }

        .empty-month-content {
            text-align: center;
            padding: var(--space-large);
        }

        .empty-month .month-name {
            font-size: 1.2em;
            color: var(--accent-sage);
            font-weight: 500;
            margin-bottom: 0.5em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .empty-month .empty-hint {
            font-size: 2em;
            color: var(--text-tertiary);
            opacity: 0.4;
        }

        .sync-button {
            background: var(--accent-sage);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-medium);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: var(--transition-standard);
            font-family: var(--font-sans);
        }

        .sync-button:hover {
            background: var(--accent-sage-deep);
            transform: translateY(-2px);
            box-shadow: var(--shadow-medium);
        }

        .sync-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .sync-status {
            margin-left: 16px;
            color: var(--text-secondary);
            font-size: 14px;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .rotating {
            animation: rotate 1s linear infinite;
        }

        /* ============================================
           YEAR SELECTOR STYLES
           ============================================ */
        .year-selector {
            display: flex;
            align-items: center;
            gap: var(--space-medium);
            margin-top: var(--space-medium);
        }

        .year-nav-btn {
            background: var(--surface-elevated);
            border: 1px solid var(--accent-sage);
            border-radius: var(--radius-small);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all var(--transition-standard);
            color: var(--accent-sage-deep);
        }

        .year-nav-btn:hover:not(:disabled) {
            background: var(--accent-sage);
            color: white;
        }

        .year-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .year-dropdown {
            position: relative;
        }

        .year-current {
            background: var(--surface-elevated);
            border: 2px solid var(--accent-sage-deep);
            border-radius: var(--radius-medium);
            padding: 12px 20px;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: var(--space-small);
            cursor: pointer;
            transition: all var(--transition-standard);
            color: var(--accent-sage-deep);
        }

        .year-current:hover {
            background: var(--surface-secondary);
        }

        .year-dropdown-menu {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            margin-top: var(--space-small);
            background: var(--surface-elevated);
            border: 1px solid var(--accent-sage);
            border-radius: var(--radius-medium);
            box-shadow: var(--shadow-medium);
            max-height: 300px;
            overflow-y: auto;
            display: none;
            z-index: 1000;
        }

        .year-dropdown-menu.show {
            display: block;
        }

        .year-option {
            padding: 12px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background var(--transition-fast);
        }

        .year-option:hover {
            background: var(--surface-tertiary);
        }

        .year-option.active {
            background: var(--accent-sage);
            color: white;
            font-weight: 600;
        }

        .year-count {
            font-size: 12px;
            opacity: 0.7;
        }

        .loading-state, .empty-state, .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-xlarge);
            text-align: center;
            color: var(--text-secondary);
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--surface-tertiary);
            border-top-color: var(--accent-sage);
            border-radius: 50%;
            animation: rotate 1s linear infinite;
            margin-bottom: var(--space-medium);
        }

        .empty-state .material-icons, .error-state .material-icons {
            margin-bottom: var(--space-medium);
        }

        .sync-btn, .retry-btn {
            background: var(--accent-sage);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: var(--radius-medium);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition-standard);
            margin-top: var(--space-medium);
        }

        .sync-btn:hover, .retry-btn:hover {
            background: var(--accent-sage-deep);
        }

        @media (max-width: 768px) {
            .photo-grid {
                grid-template-columns: 1fr;
                gap: var(--space-medium);
            }

            .year-title {
                font-size: 36px;
            }

            .year-selector {
                justify-content: center;
            }
        }

        /* ============================================
           SWAP MODAL STYLES
           ============================================ */
        .swap-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(42, 40, 37, 0.85);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .swap-modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface-primary);
            border-radius: var(--radius-large);
            width: 90%;
            max-width: 900px;
            max-height: 85vh;
            overflow: hidden;
            box-shadow: var(--shadow-high);
        }

        .modal-header {
            padding: var(--space-large);
            border-bottom: 1px solid var(--surface-tertiary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px 8px;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text-primary);
        }

        .modal-tabs {
            display: flex;
            border-bottom: 2px solid var(--surface-tertiary);
            padding: 0 var(--space-large);
        }

        .tab-btn {
            background: none;
            border: none;
            padding: var(--space-medium) var(--space-large);
            font-size: 16px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all var(--transition-fast);
        }

        .tab-btn.active {
            color: var(--accent-sage-deep);
            border-bottom-color: var(--accent-sage-deep);
        }

        .modal-body {
            padding: var(--space-large);
            max-height: calc(85vh - 200px);
            overflow-y: auto;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .alternatives-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: var(--space-medium);
        }

        .alt-photo-card {
            cursor: pointer;
            border-radius: var(--radius-small);
            overflow: hidden;
            border: 3px solid transparent;
            transition: all var(--transition-fast);
        }

        .alt-photo-card:hover {
            border-color: var(--accent-sage);
            transform: scale(1.05);
        }

        .alt-photo-img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .alt-photo-info {
            padding: var(--space-small);
            background: var(--surface-elevated);
            font-size: 12px;
            color: var(--text-secondary);
        }

        .month-group {
            margin-bottom: var(--space-xlarge);
        }

        .month-group-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent-sage-deep);
            margin-bottom: var(--space-medium);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header">
        <div class="header-content">
            <h1 class="year-title" id="year">Loading...</h1>
            <p class="subtitle" id="subtitle">Loading your curated moments...</p>

            <!-- Year Selector -->
            <div class="year-selector">
                <button class="year-nav-btn" id="prevYearBtn" onclick="navigateYear(-1)">
                    <span class="material-icons">chevron_left</span>
                </button>

                <div class="year-dropdown">
                    <button class="year-current" id="currentYearBtn" onclick="toggleYearDropdown()">
                        <span id="currentYearText">2023</span>
                        <span class="material-icons">expand_more</span>
                    </button>

                    <div class="year-dropdown-menu" id="yearDropdownMenu">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <button class="year-nav-btn" id="nextYearBtn" onclick="navigateYear(1)">
                    <span class="material-icons">chevron_right</span>
                </button>
            </div>

            <div class="stats-row" id="stats">
                <!-- Stats will be loaded dynamically -->
            </div>

            <div class="sync-controls" style="margin-top: 24px;">
                <button id="syncButton" class="sync-button">
                    <i class="material-icons">sync</i>
                    Sync with Google Photos
                </button>
                <span id="syncStatus" class="sync-status"></span>
            </div>
        </div>
    </div>

    <div class="container-custom">
        <!-- Timeline -->
        <div class="timeline">
            <div class="timeline-title">Monthly Distribution</div>
            <div class="months-row" id="timeline">
                <!-- Timeline will be loaded dynamically -->
            </div>
        </div>

        <!-- Photo Grid -->
        <div class="photo-grid" id="photoGrid">
            <!-- Photos will be loaded dynamically -->
        </div>
    </div>
</div>

<!-- Swap Photo Modal -->
<div class="swap-modal" id="swapModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 class="modal-title" id="modalTitle">Swap Photo for Month</h2>
            <button class="close-btn" onclick="closeSwapModal()">&times;</button>
        </div>

        <div class="modal-tabs">
            <button class="tab-btn active" onclick="switchTab('auto')">Auto Pick</button>
            <button class="tab-btn" onclick="switchTab('browse')">Browse All</button>
        </div>

        <div class="modal-body">
            <div class="tab-content active" id="autoTab">
                <p style="color: var(--text-secondary); margin-bottom: 20px;">
                    Best alternatives from the same capture month (photos taken at the same time):
                </p>
                <div class="alternatives-grid" id="autoPickGrid">
                    <!-- Auto-picked alternatives will be loaded here -->
                </div>
            </div>

            <div class="tab-content" id="browseTab">
                <p style="color: var(--text-secondary); margin-bottom: 20px;">
                    Choose from all 35 photos (sorted by quality score):
                </p>
                <div id="browseAllGrid">
                    <!-- All photos will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function renderGallery(data) {
    if (!data || !data.photos || data.photos.length !== 12) {
        console.error('Invalid gallery data:', data);
        showErrorState(new Error('Invalid data structure'));
        return;
    }

    const sortedPhotos = [...data.photos].sort((a, b) => a.month_slot - b.month_slot);
    const monthShort = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                        'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    document.getElementById('year').textContent = data.year;
    document.getElementById('subtitle').textContent = 'Your year in twelve unforgettable moments';

    const avgScore = sortedPhotos.reduce((sum, p) => sum + p.combined_score, 0) / sortedPhotos.length;
    document.getElementById('stats').innerHTML = `
        <div class="stat-chip">
            <i class="material-icons">photo_camera</i>
            ${sortedPhotos.length} photos from 12 months
        </div>
        <div class="stat-chip">
            <i class="material-icons">star</i>
            Avg score: ${avgScore.toFixed(1)}/100
        </div>
    `;

    const timelineHTML = monthShort.map((month, i) => {
        return `<div class="month-pill active">${month}</div>`;
    }).join('');
    document.getElementById('timeline').innerHTML = timelineHTML;

    const gallery = document.querySelector('.photo-grid');
    gallery.innerHTML = sortedPhotos.map(photo => {
        const monthName = monthNames[photo.month_slot - 1];
        const photoUrl = `/photos/${data.year}/${photo.filename}`;
        const date = new Date(photo.captured_at);
        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });

        const combinedClass = photo.combined_score >= 70 ? 'high' :
                             photo.combined_score >= 50 ? 'medium' : 'low';
        const qualityClass = photo.quality_score >= 70 ? 'high' :
                            photo.quality_score >= 50 ? 'medium' : 'low';
        const emotionalClass = photo.emotional_score >= 70 ? 'high' :
                              photo.emotional_score >= 50 ? 'medium' : 'low';

        return `
            <div class="photo-card" data-month-slot="${photo.month_slot}" data-photo-id="${photo.id}">
                <div class="photo-wrapper">
                    <img src="${photoUrl}"
                         class="photo-img"
                         alt="${monthName} - ${photo.filename}"
                         loading="lazy"
                         onerror="this.onerror=null; this.src='/api/photos/${photo.id}';">

                    <div class="swap-overlay">
                        <button class="swap-btn" onclick="openSwapModal(${photo.month_slot}, '${monthName}')">
                            Swap Photo
                        </button>
                    </div>
                </div>

                <div class="card-content">
                    <div class="card-month">${monthName.toUpperCase()}</div>
                    <div class="card-date">${dateStr}</div>
                    <div class="card-filename">${photo.filename}</div>

                    <div class="score-row">
                        <div class="score-badge ${combinedClass}">
                            <div class="score-label">Combined</div>
                            <div class="score-value">${Math.round(photo.combined_score)}</div>
                        </div>
                        <div class="score-badge ${qualityClass}">
                            <div class="score-label">Quality</div>
                            <div class="score-value">${Math.round(photo.quality_score)}</div>
                        </div>
                        <div class="score-badge ${emotionalClass}">
                            <div class="score-label">Emotional</div>
                            <div class="score-value">${Math.round(photo.emotional_score)}</div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }).join('');
}

// Sync with Google Photos
document.getElementById('syncButton')?.addEventListener('click', async () => {
    const button = document.getElementById('syncButton');
    const status = document.getElementById('syncStatus');

    button.disabled = true;
    button.innerHTML = '<i class="material-icons rotating">sync</i> Syncing...';
    status.textContent = 'Fetching photos from Google Photos...';

    try {
        const response = await fetch('/sync', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({year: currentYear})
        });

        if (response.ok) {
            status.textContent = 'Sync complete! Reloading...';
            setTimeout(async () => {
                await loadGalleryForYear(currentYear);
                status.textContent = '';
            }, 1000);
        } else {
            throw new Error('Sync failed');
        }
    } catch (error) {
        status.textContent = 'Sync failed. Please try again.';
        console.error('Sync error:', error);
    } finally {
        button.disabled = false;
        button.innerHTML = '<i class="material-icons">sync</i> Sync with Google Photos';
    }
});

// ============================================
// PHOTO SWAP FUNCTIONALITY
// ============================================

async function openSwapModal(monthSlot, monthName) {
    currentSwapMonthSlot = monthSlot;
    currentSwapMonthName = monthName;

    const modal = document.getElementById('swapModal');
    const modalTitle = document.getElementById('modalTitle');

    modalTitle.textContent = `Swap Photo for ${monthName} ${currentYear}`;
    modal.classList.add('active');

    await loadAlternatives(monthSlot);
    await loadAllPhotos();
}

function closeSwapModal() {
    document.getElementById('swapModal').classList.remove('active');
    currentSwapMonthSlot = null;
    currentSwapMonthName = null;
}

function switchTab(tabName) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');

    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

    if (tabName === 'auto') {
        document.getElementById('autoTab').classList.add('active');
    } else {
        document.getElementById('browseTab').classList.add('active');
    }
}

async function loadAlternatives(monthSlot) {
    try {
        const response = await fetch(`/api/year/${currentYear}/alternatives/${monthSlot}`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const grid = document.getElementById('autoPickGrid');

        if (!data.alternatives || data.alternatives.length === 0) {
            grid.innerHTML = `
                <p class="no-alternatives" style="color: var(--text-secondary);">
                    No other photos from ${monthNames[monthSlot - 1]}<br>
                    Try "Browse All" to see all ${currentYear} photos.
                </p>
            `;
            return;
        }

        const topAlternatives = data.alternatives
            .sort((a, b) => b.combined_score - a.combined_score)
            .slice(0, 10);

        grid.innerHTML = topAlternatives.map(photo => {
            const photoUrl = `/photos/${currentYear}/${photo.filename}`;
            return `
                <div class="alt-photo-card" onclick="swapPhoto(${photo.id})">
                    <img src="${photoUrl}"
                         class="alt-photo-img"
                         alt="${photo.filename}"
                         onerror="this.onerror=null; this.src='/api/photos/${photo.id}';">
                    <div class="alt-photo-info">
                        Score: ${Math.round(photo.combined_score)}
                    </div>
                </div>
            `;
        }).join('');

    } catch (error) {
        console.error('Failed to load alternatives:', error);
        document.getElementById('autoPickGrid').innerHTML = `
            <p class="error" style="color: var(--text-secondary);">Failed to load alternatives</p>
        `;
    }
}

async function loadAllPhotos() {
    try {
        const response = await fetch(`/api/year/${currentYear}/photos`);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const photos = await response.json();
        const grid = document.getElementById('browseAllGrid');

        if (!photos || photos.length === 0) {
            grid.innerHTML = '<p style="color: var(--text-secondary);">No photos available</p>';
            return;
        }

        const sortedPhotos = [...photos].sort((a, b) => b.combined_score - a.combined_score);

        grid.innerHTML = `
            <div class="alternatives-grid">
                ${sortedPhotos.map(photo => {
                    const photoUrl = `/photos/${currentYear}/${photo.filename}`;
                    return `
                        <div class="alt-photo-card" onclick="swapPhoto(${photo.id})">
                            <img src="${photoUrl}"
                                 class="alt-photo-img"
                                 alt="${photo.filename}"
                                 onerror="this.onerror=null; this.src='/api/photos/${photo.id}';">
                            <div class="alt-photo-info">
                                Score: ${Math.round(photo.combined_score)}
                            </div>
                        </div>
                    `;
                }).join('')}
            </div>
        `;

    } catch (error) {
        console.error('Failed to load all photos:', error);
        document.getElementById('browseAllGrid').innerHTML = `
            <p class="error" style="color: var(--text-secondary);">Failed to load photos</p>
        `;
    }
}

async function swapPhoto(newPhotoId) {
    if (!currentSwapMonthSlot || !currentYear) {
        console.error('Missing swap context');
        return;
    }

    try {
        const response = await fetch('/api/swaps', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                year: currentYear,
                month_slot: currentSwapMonthSlot,
                new_photo_id: newPhotoId,
                reason: 'User manual swap'
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || 'Swap failed');
        }

        const result = await response.json();
        console.log('Swap successful:', result);

        await loadGalleryForYear(currentYear);
        closeSwapModal();

    } catch (error) {
        console.error('Failed to swap photo:', error);
        alert(`Failed to swap photo: ${error.message}`);
    }
}


// Close modal when clicking outside
document.getElementById('swapModal')?.addEventListener('click', (e) => {
    if (e.target.id === 'swapModal') {
        closeSwapModal();
    }
});

// ============================================
// MULTI-YEAR NAVIGATION
// ============================================

let availableYears = [];
let currentYear = new Date().getFullYear();
let galleryData = null;
let currentSwapMonthSlot = null;
let currentSwapMonthName = null;

const monthNames = ['January', 'February', 'March', 'April', 'May', 'June',
                   'July', 'August', 'September', 'October', 'November', 'December'];

async function loadAvailableYears() {
    try {
        const response = await fetch('/api/years');
        const data = await response.json();
        availableYears = data.sort((a, b) => b.year - a.year);  // Newest first

        // Populate dropdown
        populateYearDropdown();

        // Set current year (default to newest with photos)
        const latestYear = availableYears.find(y => y.photo_count > 0);
        if (latestYear) {
            currentYear = latestYear.year;
            updateYearDisplay();
        }

    } catch (error) {
        console.error('Failed to load years:', error);
    }
}

function populateYearDropdown() {
    const menu = document.getElementById('yearDropdownMenu');
    menu.innerHTML = availableYears.map(yearData => {
        const isActive = yearData.year === currentYear;
        const photoText = yearData.photo_count > 0
            ? `${yearData.photo_count} photos`
            : 'No photos yet';

        return `
            <div class="year-option ${isActive ? 'active' : ''}"
                 onclick="selectYear(${yearData.year})">
                <span>${yearData.year}</span>
                <span class="year-count">${photoText}</span>
            </div>
        `;
    }).join('');
}

function toggleYearDropdown() {
    const menu = document.getElementById('yearDropdownMenu');
    menu.classList.toggle('show');
}

// Close dropdown when clicking outside
document.addEventListener('click', function(event) {
    const dropdown = document.querySelector('.year-dropdown');
    if (dropdown && !dropdown.contains(event.target)) {
        document.getElementById('yearDropdownMenu').classList.remove('show');
    }
});

async function selectYear(year) {
    currentYear = year;
    updateYearDisplay();
    toggleYearDropdown();

    // Load photos for new year
    await loadGalleryForYear(year);
}

function navigateYear(direction) {
    const currentIndex = availableYears.findIndex(y => y.year === currentYear);
    const newIndex = currentIndex - direction;  // Subtract because list is newest-first

    if (newIndex >= 0 && newIndex < availableYears.length) {
        selectYear(availableYears[newIndex].year);
    }
}

function updateYearDisplay() {
    document.getElementById('currentYearText').textContent = currentYear;

    // Update nav buttons (disable if at edges)
    const currentIndex = availableYears.findIndex(y => y.year === currentYear);
    document.getElementById('prevYearBtn').disabled = currentIndex === availableYears.length - 1;
    document.getElementById('nextYearBtn').disabled = currentIndex === 0;

    // Update dropdown active state
    populateYearDropdown();
}

async function loadGalleryForYear(year) {
    try {
        showLoadingState();

        const response = await fetch(`/api/year/${year}/twelve`);

        if (!response.ok) {
            if (response.status === 404) {
                showEmptyState(year);
                return;
            }
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        // data = { year, strategy, curation_id, photos: [12 photos with month_slot] }

        galleryData = data;
        renderGallery(data);

    } catch (error) {
        console.error('Failed to load gallery:', error);
        showErrorState(error);
    }
}

function showLoadingState() {
    const gallery = document.querySelector('.photo-grid');
    gallery.innerHTML = `
        <div class="loading-state">
            <div class="spinner"></div>
            <p>Loading your twelve moments...</p>
        </div>
    `;
}

function showEmptyState(year) {
    const gallery = document.querySelector('.photo-grid');
    gallery.innerHTML = `
        <div class="empty-state">
            <span class="material-icons" style="font-size: 64px; opacity: 0.3;">photo_library</span>
            <h3>No photos for ${year} yet</h3>
            <p>Connect Google Photos or add photos manually to get started.</p>
            <button class="sync-btn" onclick="syncGooglePhotos()">
                Connect Google Photos
            </button>
        </div>
    `;
}

function showErrorState(error) {
    const gallery = document.querySelector('.photo-grid');
    gallery.innerHTML = `
        <div class="error-state">
            <span class="material-icons" style="font-size: 64px; color: #d32f2f;">error_outline</span>
            <h3>Couldn't load photos</h3>
            <p>${error.message}</p>
            <button class="retry-btn" onclick="loadGalleryForYear(currentYear)">
                Try Again
            </button>
        </div>
    `;
}

function syncGooglePhotos() {
    const button = document.getElementById('syncButton');
    if (button) {
        button.click();
    }
}

// Load gallery on page load - now uses multi-year system
window.addEventListener('DOMContentLoaded', async function() {
    await loadAvailableYears();
    await loadGalleryForYear(currentYear);
});
</script>
